   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineLogue — Film Journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --text-light: #ffffff;
      --text-muted: #a1a5ab;
      --accent: #ffffff;
      --border: rgba(255, 255, 255, 0.15);
      --glass-bg: rgba(15, 15, 20, 0.4); 
      --font-main: 'Syne', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, input, textarea, select, button {
      color: var(--text-light);
      font-family: var(--font-main); 
      line-height: 1.6;
      background-color: #050506; 
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    header {
      padding: 2rem 3rem;
      position: absolute;
      top: 0;
      width: 100%;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #fff;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    nav { display: flex; gap: 0.5rem; }

    nav button {
      background: none;
      border: 1px solid transparent;
      color: rgba(255,255,255,0.6);
      font-family: var(--font-main);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }

    nav button:hover, nav button.active {
      color: #fff;
      border-color: rgba(255,255,255,0.2);
    }

    .tab-content { display: none; }
    .tab-content.active { 
      display: block; 
      animation: fadeIn 0.5s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hero-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 0 10%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.8) 100%);
    }

    .hero-title {
      font-size: clamp(2.5rem, 8vw, 7rem);
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: -2px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    .hero-subtitle {
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-left: 0.3rem;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }

    .archive-section {
      padding: 5rem 10%;
      min-height: 100vh;
      background: rgba(0,0,0,0.4);
    }

    /* --- Dynamic Scroll Reveal Styling --- */
    .editorial-spread {
      background: var(--glass-bg);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 3rem;
      margin-bottom: 4rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.5);
      
      /* Hidden state before scrolling */
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
    }

    /* Visible state triggered by JavaScript */
    .editorial-spread.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .editorial-spread.is-visible:hover {
      transform: translateY(-8px);
      box-shadow: 0 40px 70px rgba(0,0,0,0.7);
    }

    .spread-header {
      display: grid;
      grid-template-columns: 200px 1fr;
      gap: 3rem;
      margin-bottom: 2rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid var(--border);
    }

    .poster-frame img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      border-radius: 8px;
    }

    .meta-details h2 {
      font-size: clamp(2rem, 4vw, 3.5rem);
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 1rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stars-large { color: var(--accent); font-size: 1.5rem; letter-spacing: 2px;}
    
    .reaction-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .react-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.3s ease;
    }
    
    .react-btn:hover { background: #fff; color: #000; transform: scale(1.05); }

    /* Fix for cut-off letters (Descenders) */
    .editorial-body {
      font-size: 1.15rem;
      line-height: 1.9;
      color: rgba(255,255,255,0.9);
      font-weight: 400;
      padding-bottom: 0.4em; 
    }
    
    .editorial-body p {
      padding-bottom: 0.5em; /* Gives letters like 'g' room to breathe */
    }

    .comments-wrapper {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
    }

    .comment-item {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 1rem;
      color: rgba(255,255,255,0.9);
      line-height: 1.6;
      padding-bottom: 1.2rem; /* Additional breathing room */
    }

    .comment-author {
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      display: block;
      color: #fff;
      margin-bottom: 0.3rem;
    }

    .comment-form {
      margin-top: 1.5rem; 
      display: flex; 
      gap: 0.5rem;
    }
    .comment-input-name { width: 30%; }
    .comment-input-text { width: 70%; }
    
    .comment-input-name, .comment-input-text {
      background: rgba(0,0,0,0.3); 
      border: 1px solid var(--border); 
      margin: 0; 
      padding: 0.8rem;
    }
    .comment-submit-btn { width: auto; padding: 0 1.5rem; margin: 0; }

    /* Placeholder content for new tabs */
    .placeholder-content {
      padding: 10rem 10%;
      text-align: center;
      min-height: 100vh;
      background: rgba(0,0,0,0.6);
    }
    .placeholder-content h2 {
      font-size: 3rem;
      text-transform: uppercase;
      font-weight: 800;
    }

    /* Hidden Admin Modal */
    .admin-modal {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      z-index: 1000;
      display: none; 
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .admin-modal.active { display: flex; }

    .form-card {
      background: #111;
      border: 1px solid #333;
      padding: 3rem;
      width: 100%;
      max-width: 600px;
      border-radius: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .close-btn {
      float: right; background: none; border: none; color: #fff;
      font-size: 1.5rem; cursor: pointer;
    }

    input, textarea, select {
      padding: 1rem; margin-top: 0.5rem; margin-bottom: 1.5rem;
      background: #000; border: 1px solid #333; color: #fff;
      border-radius: 4px;
    }

    .submit-btn {
      background: #fff; color: #000;
      font-weight: 800; text-transform: uppercase;
      border: none; padding: 1.2rem; width: 100%; cursor: pointer;
      border-radius: 4px; transition: 0.3s;
    }
    
    .submit-btn:hover { background: #ccc; }

    /* --- MOBILE RESPONSIVE SHAPE-SHIFTING --- */
    @media (max-width: 768px) {
      header { 
        padding: 1.5rem; 
        flex-direction: column;
        gap: 1rem;
      }
      
      .hero-section { padding: 0 5%; }
      .archive-section { padding: 3rem 5%; }
      
      .editorial-spread { 
        padding: 1.5rem; 
        margin-bottom: 2.5rem; 
      }
      
      .spread-header { 
        grid-template-columns: 1fr; 
        gap: 1.5rem;
        padding-bottom: 1.5rem;
      }
      
      .poster-frame img { height: auto; aspect-ratio: 2/3; }
      
      .meta-details h2 { font-size: 2.2rem; }
      
      .form-card { padding: 1.5rem; }
      
      .comment-form { flex-direction: column; }
      .comment-input-name, .comment-input-text { width: 100%; }
      .comment-submit-btn { width: 100%; padding: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" ondblclick="window.secretLogin()">CineLogue</div>
    <!-- New Navigation Scaffold -->
    <nav>
      <button class="nav-btn active" onclick="window.switchTab('mainArchive')">Reviews</button>
      <button class="nav-btn" onclick="window.switchTab('visuals')">Visuals</button>
      <button class="nav-btn" onclick="window.switchTab('about')">Strategy</button>
    </nav>
  </header>

  <!-- TAB 1: THE MAIN REVIEWS -->
  <main id="mainArchive" class="tab-content active">
    <section class="hero-section">
      <h1 class="hero-title">CINELOGUE<br>REVIEWS</h1>
      <p class="hero-subtitle">I'd love any feedback, please leave a comment</p>
    </section>

    <section class="archive-section" id="archiveContainer">
      <!-- Reviews load here automatically -->
    </section>
  </main>

  <!-- TAB 2: VISUALS GALLERY -->
  <main id="visuals" class="tab-content">
    <div class="placeholder-content">
      <h2>Concept & Illustration</h2>
      <p style="margin-top: 1rem; color: #a1a5ab;">A dedicated space for custom digital art and lighting studies.</p>
    </div>
  </main>

  <!-- TAB 3: ABOUT / STRATEGY -->
  <main id="about" class="tab-content">
    <div class="placeholder-content">
      <h2>Industry Profile</h2>
      <p style="margin-top: 1rem; color: #a1a5ab;">A professional biography detailing academic background and curation strategy.</p>
    </div>
  </main>

  <div id="adminModal" class="admin-modal">
    <div class="form-card">
      <button class="close-btn" onclick="window.closeModal()">✕</button>
      <h2 style="text-transform: uppercase; margin-bottom: 2rem;">Director's Desk</h2>
      <form id="reviewForm" onsubmit="window.submitReview(event)">
        <input type="text" id="filmTitle" placeholder="Film Title & Year" required>
        <select id="rating">
          <option value="★★★★★">★★★★★ (5 Stars)</option>
          <option value="★★★★☆">★★★★☆ (4 Stars)</option>
          <option value="★★★☆☆">★★★☆☆ (3 Stars)</option>
          <option value="★★☆☆☆">★★☆☆☆ (2 Stars)</option>
          <option value="★☆☆☆☆">★☆☆☆☆ (1 Star)</option>
        </select>
        <input type="url" id="imageUrl" placeholder="Poster Image Link (Your Art)">
        <textarea id="essayText" rows="6" placeholder="Write your full essay review..." required></textarea>
        <input type="text" id="authorName" value="Alex" required>
        <button type="submit" class="submit-btn">Publish Review</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAViJmWUhWB0dDmOMBighKJ3kbLIO-luqU",
      authDomain: "cinelogue-93437.firebaseapp.com",
      projectId: "cinelogue-93437",
      storageBucket: "cinelogue-93437.firebasestorage.app",
      messagingSenderId: "37277377178",
      appId: "1:37277377178:web:198b7236aebef0b3fbf523"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dynamic Tab Navigation
    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      window.scrollTo(0, 0); // Scroll to top on tab change
      
      const buttons = document.querySelectorAll('.nav-btn');
      if (tabId === 'mainArchive') buttons[0].classList.add('active');
      if (tabId === 'visuals') buttons[1].classList.add('active');
      if (tabId === 'about') buttons[2].classList.add('active');
    }

    window.secretLogin = function() {
      const passcode = prompt("Director Access Required:");
      if (passcode === "action") {
        document.getElementById('adminModal').classList.add('active');
      }
    }
    
    window.closeModal = function() {
      document.getElementById('adminModal').classList.remove('active');
    }

    // Scroll Reveal Observer Setup
    const setupScrollObserver = () => {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
          }
        });
      }, { threshold: 0.1 }); 

      document.querySelectorAll('.editorial-spread').forEach((card) => {
        observer.observe(card);
      });
    }

    window.submitReview = async function(e) {
      e.preventDefault();
      const title = document.getElementById('filmTitle').value;
      const rating = document.getElementById('rating').value;
      const imageUrl = document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80';
      const essay = document.getElementById('essayText').value;
      const author = document.getElementById('authorName').value;

      await addDoc(collection(db, "reviews"), {
        title: title, 
        rating: rating, 
        imageUrl: imageUrl, 
        essay: essay, 
        author: author, 
        thumbsUp: 0,
        thumbsDown: 0, 
        timestamp: new Date()
      });

      document.getElementById('reviewForm').reset();
      window.closeModal();
      window.loadArchive();
    }

    window.submitComment = async function(e, reviewId) {
      e.preventDefault();
      const storageKey = `commented_${reviewId}`;
      if (localStorage.getItem(storageKey)) {
        alert("You have already left a comment on this review! Thank you for the feedback.");
        return; 
      }
      const form = e.target;
      const name = form.elements[0].value;
      const text = form.elements[1].value;
      await addDoc(collection(db, "reviews", reviewId, "comments"), {
        name: name, text: text, timestamp: new Date()
      });
      localStorage.setItem(storageKey, 'true');
      window.loadArchive();
    }

    window.reactToReview = async function(reviewId, type) {
      const storageKey = `reacted_${reviewId}`;
      if (localStorage.getItem(storageKey)) {
        alert("You have already reacted to this review!");
        return;
      }
      const reviewRef = doc(db, "reviews", reviewId);
      if (type === 'up') {
        await updateDoc(reviewRef, { thumbsUp: increment(1) });
      } else if (type === 'down') {
        await updateDoc(reviewRef, { thumbsDown: increment(1) });
      }
      localStorage.setItem(storageKey, 'true');
      window.loadArchive(); 
    }

    window.loadArchive = async function() {
      const container = document.getElementById('archiveContainer');
      const q = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        container.innerHTML = `<div style="text-align: center; color: white;">No reviews yet.</div>`;
        return;
      }

      container.innerHTML = ''; 

      for (const doc of querySnapshot.docs) {
        const data = doc.data();
        const reviewId = doc.id; 
        
        const thumbsUpCount = data.thumbsUp || 0; 
        const thumbsDownCount = data.thumbsDown || 0; 

        const commentsQ = query(collection(db, "reviews", reviewId, "comments"), orderBy("timestamp", "asc"));
        const commentsSnapshot = await getDocs(commentsQ);
        
        let commentsHTML = '';
        commentsSnapshot.forEach((commentDoc) => {
          const cData = commentDoc.data();
          commentsHTML += `
            <div class="comment-item">
              <span class="comment-author">${cData.name}</span>
              <p>${cData.text}</p>
            </div>
          `;
        });

        const reviewCard = document.createElement('article');
        reviewCard.className = 'editorial-spread';
        
        reviewCard.innerHTML = `
          <div class="spread-header">
            <div class="poster-frame">
              <img src="${data.imageUrl}" alt="${data.title}">
            </div>
            <div class="meta-details">
              <h2>${data.title}</h2>
              <div class="stars-large">${data.rating}</div>
              
              <div class="reaction-bar">
                <button class="react-btn" onclick="window.reactToReview('${reviewId}', 'up')">
                  👍 ${thumbsUpCount}
                </button>
                <button class="react-btn" onclick="window.reactToReview('${reviewId}', 'down')">
                  👎 ${thumbsDownCount}
                </button>
              </div>
            </div>
          </div>
          <div class="editorial-body">
            <p>${data.essay}</p>
          </div>
          <section class="comments-wrapper">
            <h4 style="text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 1rem;">Discussion</h4>
            <div class="comment-list">${commentsHTML}</div>
            <form class="comment-form" onsubmit="window.submitComment(event, '${reviewId}')">
              <input class="comment-input-name" type="text" placeholder="Name" required>
              <input class="comment-input-text" type="text" placeholder="Add a comment..." required>
              <button class="submit-btn comment-submit-btn" type="submit">Post</button>
            </form>
          </section>
        `;
        container.appendChild(reviewCard);
      }
      
      // Fire up the scroll animation engine once reviews are loaded
      setupScrollObserver();
    }

    window.loadArchive();
  </script>
</body>
</html>
