<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineLogue — Film Journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --card-bg: rgba(18, 19, 24, 0.85); /* Slightly transparent to see the background */
      --text-dark: #121212;
      --text-muted: #a1a5ab;
      --text-light: #e5e5e5;
      --accent: #00e054;
      --star: #ffb020;
      --border: rgba(255, 255, 255, 0.1);
      --font-headline: 'Syne', sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      /* THIS IS THE NEW BACKGROUND LINK */
      background-image: url('download (6).jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #050506; /* Fallback color */
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    @keyframes slowReveal {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header {
      background-color: rgba(5, 5, 6, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-family: var(--font-headline);
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
      user-select: none;
    }

    .brand span { color: var(--accent); }

    nav { display: flex; gap: 0.5rem; }

    nav button {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-headline);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    nav button:hover, nav button.active {
      color: #fff;
      border-color: rgba(255,255,255,0.2);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .tab-content { display: none; }
    
    .tab-content.active { 
      display: block; 
      animation: slowReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .hero-box {
      border: 1px solid var(--border);
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 6rem 2rem;
      text-align: center;
      border-radius: 8px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 5rem;
      line-height: 1.1;
      margin-bottom: 1rem;
      color: #fff;
      text-transform: uppercase;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.2rem;
      margin: 0 auto 2.5rem auto;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .hero-btn {
      background: var(--accent);
      color: #000;
      font-family: var(--font-headline);
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      padding: 0.8rem 2rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    
    .hero-btn:hover {
      transform: scale(1.05);
      background: #00c048;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      padding: 2.5rem;
      max-width: 700px;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }

    .form-card h2 {
      font-family: var(--font-headline);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-family: var(--font-headline);
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.4rem;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      color: #fff;
      font-family: inherit;
      border-radius: 2px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .submit-btn {
      background: var(--accent);
      color: #000;
      font-family: var(--font-headline);
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      padding: 1rem;
      width: 100%;
      margin-top: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.3s ease;
    }
    
    .submit-btn:hover { 
      transform: scale(1.02);
      background: #00c048; 
    }

    /* --- Interactive Review Cards --- */
    .editorial-spread {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      color: var(--text-light);
      padding: 2.5rem;
      border-radius: 8px;
      margin-bottom: 3rem;
      border: 1px solid var(--border);
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* This makes the card float up when you hover over it */
    .editorial-spread:hover {
      transform: translateY(-6px);
      box-shadow: 0 35px 60px -12px rgba(0,0,0,0.95);
    }

    .spread-header {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    .poster-frame img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }

    .meta-details h2 {
      font-family: var(--font-headline);
      font-size: 2.5rem;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .stars-large { color: var(--accent); font-size: 1.8rem; }
    
    .like-btn {
      background: none;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-family: var(--font-headline);
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s ease;
    }
    
    .like-btn:hover {
      background: rgba(255,255,255,0.1);
      border-color: #fff;
      transform: scale(1.05);
    }
    
    .like-btn span { color: #ff4b4b; font-size: 1.1rem; }

    .editorial-body {
      font-family: Georgia, serif;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #d1d5db;
    }

    .comments-wrapper {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }

    .comment-item {
      background: rgba(0,0,0,0.4);
      border-left: 2px solid var(--accent);
      padding: 1rem;
      margin-bottom: 0.8rem;
      font-size: 0.95rem;
      border-radius: 0 4px 4px 0;
    }

    .comment-author {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      display: block;
      color: var(--accent);
      margin-bottom: 0.2rem;
    }

    .empty-state {
      text-align: center;
      padding: 6rem 1rem;
      border: 1px dashed var(--border);
      color: var(--text-muted);
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 8px;
    }

    @media (max-width: 650px) {
      .spread-header { grid-template-columns: 1fr; }
      .hero-title { font-size: 2.8rem; }
      header { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" ondblclick="window.secretLogin()">Cine<span>logue</span></div>
    <nav>
      <button class="nav-btn active" onclick="window.switchTab('home')">Home</button>
      <button class="nav-btn" onclick="window.switchTab('archive')">Review Archive</button>
    </nav>
  </header>

  <div class="container">
    
    <div id="home" class="tab-content active">
      <div class="hero-box">
        <h1 class="hero-title">MY FILM REVIEWS</h1>
        <p class="hero-subtitle">feel free to comment</p>
        <button class="hero-btn" onclick="window.switchTab('archive')">Read the Archive</button>
      </div>
    </div>

    <div id="write" class="tab-content">
      <div class="form-card">
        <h2>Director's Desk</h2>
        <form id="reviewForm" onsubmit="window.submitReview(event)">
          <label>Film Title & Year</label>
          <input type="text" id="filmTitle" placeholder="e.g., METROPOLIS (1927)" required>

          <label>Star Rating</label>
          <select id="rating">
            <option value="★★★★★">★★★★★ (5 Stars)</option>
            <option value="★★★★☆">★★★★☆ (4 Stars)</option>
            <option value="★★★☆☆">★★★☆☆ (3 Stars)</option>
            <option value="★★☆☆☆">★★☆☆☆ (2 Stars)</option>
            <option value="★☆☆☆☆">★☆☆☆☆ (1 Star)</option>
          </select>

          <label>Poster Image Link</label>
          <input type="url" id="imageUrl" placeholder="Link your custom illustration here...">

          <label>Essay Review</label>
          <textarea id="essayText" rows="8" placeholder="Write your full essay review..." required></textarea>

          <label>Your Name</label>
          <input type="text" id="authorName" value="Alex" required>

          <button type="submit" class="submit-btn">Publish to Archive</button>
        </form>
      </div>
    </div>

    <div id="archive" class="tab-content">
      <div id="archiveContainer">
        <div class="empty-state">
          <h3>Archive Loading...</h3>
        </div>
      </div>
    </div>

  </div>

  <script type="module">
    // Added increment and updateDoc to the engine imports for the Like button
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAViJmWUhWB0dDmOMBighKJ3kbLIO-luqU",
      authDomain: "cinelogue-93437.firebaseapp.com",
      projectId: "cinelogue-93437",
      storageBucket: "cinelogue-93437.firebasestorage.app",
      messagingSenderId: "37277377178",
      appId: "1:37277377178:web:198b7236aebef0b3fbf523"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      
      const buttons = document.querySelectorAll('.nav-btn');
      if (tabId === 'home') buttons[0].classList.add('active');
      if (tabId === 'archive') buttons[1].classList.add('active');
    }

    window.secretLogin = function() {
      const passcode = prompt("Director Access Required:");
      if (passcode === "action") {
        window.switchTab('write');
      } else if (passcode) {
        alert("Access Denied.");
      }
    }

    window.submitReview = async function(e) {
      e.preventDefault();
      
      const title = document.getElementById('filmTitle').value;
      const rating = document.getElementById('rating').value;
      const imageUrl = document.getElementById('imageUrl').value || 'https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80';
      const essay = document.getElementById('essayText').value;
      const author = document.getElementById('authorName').value;

      // Note the new "likes: 0" added here!
      await addDoc(collection(db, "reviews"), {
        title: title,
        rating: rating,
        imageUrl: imageUrl,
        essay: essay,
        author: author,
        likes: 0, 
        timestamp: new Date()
      });

      document.getElementById('reviewForm').reset();
      window.loadArchive();
      window.switchTab('archive');
    }

    window.submitComment = async function(e, reviewId) {
      e.preventDefault();
      const form = e.target;
      const name = form.elements[0].value;
      const text = form.elements[1].value;

      await addDoc(collection(db, "reviews", reviewId, "comments"), {
        name: name,
        text: text,
        timestamp: new Date()
      });
      window.loadArchive();
    }

    // THE NEW LIKE ENGINE
    window.likeReview = async function(reviewId) {
      const reviewRef = doc(db, "reviews", reviewId);
      await updateDoc(reviewRef, {
        likes: increment(1)
      });
      window.loadArchive(); 
    }

    window.loadArchive = async function() {
      const container = document.getElementById('archiveContainer');
      const q = query(collection(db, "reviews"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        container.innerHTML = `
          <div class="empty-state">
            <h3>No Reviews Published Yet</h3>
            <p>The archive is currently empty.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = ''; 

      for (const doc of querySnapshot.docs) {
        const data = doc.data();
        const reviewId = doc.id; 
        // Ensure likes never show as "undefined" for your older test reviews
        const likeCount = data.likes || 0; 

        const commentsQ = query(collection(db, "reviews", reviewId, "comments"), orderBy("timestamp", "asc"));
        const commentsSnapshot = await getDocs(commentsQ);
        
        let commentsHTML = '';
        commentsSnapshot.forEach((commentDoc) => {
          const cData = commentDoc.data();
          commentsHTML += `
            <div class="comment-item">
              <span class="comment-author">${cData.name}</span>
              ${cData.text}
            </div>
          `;
        });

        const reviewCard = document.createElement('article');
        reviewCard.className = 'editorial-spread';
        
        reviewCard.innerHTML = `
          <div class="spread-header">
            <div class="poster-frame">
              <img src="${data.imageUrl}" alt="${data.title}">
            </div>
            <div class="meta-details">
              <h2>${data.title}</h2>
              <div class="stars-large">${data.rating}</div>
              <p style="margin-top: 0.5rem; font-family: var(--font-headline); font-size: 0.8rem; text-transform: uppercase;">Reviewed by ${data.author}</p>
              <button class="like-btn" onclick="window.likeReview('${reviewId}')">
                <span>♥</span> ${likeCount}
              </button>
            </div>
          </div>
          <div class="editorial-body">
            <p>${data.essay}</p>
          </div>
          <section class="comments-wrapper">
            <h4 style="font-family: var(--font-headline); text-transform: uppercase; margin-bottom: 0.8rem; color: #fff;">Comments</h4>
            
            <div class="comment-list">
              ${commentsHTML}
            </div>

            <form onsubmit="window.submitComment(event, '${reviewId}')" style="margin-top: 1rem;">
              <input type="text" placeholder="Your Name" required style="margin-bottom: 0.4rem; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border);">
              <textarea placeholder="Write a comment..." rows="2" required style="margin-bottom: 0.4rem; background: rgba(0,0,0,0.5); color: #fff; border: 1px solid var(--border);"></textarea>
              <button class="submit-btn" type="submit" style="width: auto; padding: 0.5rem 1rem; margin-top: 0;">Post Comment</button>
            </form>
          </section>
        `;
        container.appendChild(reviewCard);
      }
    }

    window.loadArchive();
  </script>
</body>
</html>
