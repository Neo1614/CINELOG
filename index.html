<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineLogue — Film Journal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Syne:wght@600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e0f11;
      --paper: #f4f1ea;
      --card-bg: #16181d;
      --text-dark: #121212;
      --text-muted: #8a8d93;
      --text-light: #e5e5e5;
      --accent: #00e054;
      --star: #ffb020;
      --border: #262930;
      --font-headline: 'Syne', sans-serif;
      --font-serif: 'Instrument Serif', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6;
    }

    /* --- Navigation Bar --- */
    header {
      background-color: #08090a;
      border-bottom: 2px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-family: var(--font-headline);
      font-size: 1.8rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #fff;
      cursor: pointer;
    }

    .brand span { color: var(--accent); }

    nav { display: flex; gap: 0.5rem; }

    nav button {
      background: none;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-family: var(--font-headline);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    nav button:hover, nav button.active {
      color: #fff;
      border-color: #fff;
    }

    /* --- Container & Tabs --- */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* --- 1. Home Section --- */
    .hero-box {
      border: 1px solid var(--border);
      background: var(--card-bg);
      padding: 5rem 2rem;
      text-align: center;
      border-radius: 4px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 4rem;
      line-height: 1.1;
      margin-bottom: 1rem;
      color: #fff;
    }

    .hero-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 2rem auto;
    }

    .hero-btn {
      background: var(--accent);
      color: #000;
      font-family: var(--font-headline);
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      padding: 0.8rem 2rem;
      cursor: pointer;
    }

    /* --- 2. Write Review Section --- */
    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 2.5rem;
      max-width: 700px;
      margin: 0 auto;
      border-radius: 4px;
    }

    .form-card h2 {
      font-family: var(--font-headline);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-family: var(--font-headline);
      font-size: 0.8rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 1rem;
    }

    input, textarea, select {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.4rem;
      background: #0e0f11;
      border: 1px solid var(--border);
      color: #fff;
      font-family: inherit;
      border-radius: 2px;
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .submit-btn {
      background: var(--accent);
      color: #000;
      font-family: var(--font-headline);
      font-weight: 800;
      text-transform: uppercase;
      border: none;
      padding: 1rem;
      width: 100%;
      margin-top: 1.5rem;
      cursor: pointer;
    }

    /* --- 3. Review Archive Section --- */
    .editorial-spread {
      background: var(--paper);
      color: var(--text-dark);
      padding: 2.5rem;
      border-radius: 4px;
      margin-bottom: 2rem;
    }

    .spread-header {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 2rem;
      margin-bottom: 2rem;
      padding-bottom: 1.5rem;
      border-bottom: 2px solid var(--text-dark);
    }

    .poster-frame img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .meta-details h2 {
      font-family: var(--font-headline);
      font-size: 2.5rem;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .stars-large { color: var(--accent); font-size: 1.8rem; }

    .editorial-body {
      font-family: Georgia, serif;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    /* Comments Section */
    .comments-wrapper {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #ccc;
    }

    .comment-item {
      background: rgba(0,0,0,0.04);
      border-left: 3px solid var(--accent);
      padding: 0.6rem 0.8rem;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .comment-author {
      font-family: var(--font-headline);
      font-weight: 700;
      font-size: 0.75rem;
      text-transform: uppercase;
      display: block;
      color: #555;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 1rem;
      border: 1px dashed var(--border);
      color: var(--text-muted);
    }

    @media (max-width: 650px) {
      .spread-header { grid-template-columns: 1fr; }
      .hero-title { font-size: 2.8rem; }
      header { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="brand" onclick="switchTab('home')">Cine<span>logue</span></div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('home')">Home</button>
      <button class="nav-btn" onclick="switchTab('write')">Write Review</button>
      <button class="nav-btn" onclick="switchTab('archive')">Review Archive</button>
    </nav>
  </header>

  <div class="container">
    
    <!-- Tab 1: Home Page -->
    <div id="home" class="tab-content active">
      <div class="hero-box">
        <h1 class="hero-title">Film Reviews & Critical Essays</h1>
        <p class="hero-subtitle">A minimal personal film journal for essay-style movie reviews and community discussions.</p>
        <button class="hero-btn" onclick="switchTab('write')">Write A Review</button>
      </div>
    </div>

    <!-- Tab 2: Write Review Page -->
    <div id="write" class="tab-content">
      <div class="form-card">
        <h2>Write a Review</h2>
        <form id="reviewForm" onsubmit="submitReview(event)">
          <label>Film Title & Year</label>
          <input type="text" id="filmTitle" placeholder="e.g., METROPOLIS (1927)" required>

          <label>Star Rating</label>
          <select id="rating">
            <option value="★★★★★">★★★★★ (5 Stars)</option>
            <option value="★★★★☆">★★★★☆ (4 Stars)</option>
            <option value="★★★☆☆">★★★☆☆ (3 Stars)</option>
            <option value="★★☆☆☆">★★☆☆☆ (2 Stars)</option>
            <option value="★☆☆☆☆">★☆☆☆☆ (1 Star)</option>
          </select>

          <label>Poster Image Link (Optional)</label>
          <input type="url" id="imageUrl" placeholder="https://example.com/poster.jpg">

          <label>Essay Review</label>
          <textarea id="essayText" rows="8" placeholder="Write your full essay review..." required></textarea>

          <label>Your Name</label>
          <input type="text" id="authorName" placeholder="e.g., Alex Mercer" required>

          <button type="submit" class="submit-btn">Publish to Archive</button>
        </form>
      </div>
    </div>

    <!-- Tab 3: Review Archive Page -->
    <div id="archive" class="tab-content">
      <div id="archiveContainer">
        <div class="empty-state">
          <h3>No Reviews Published Yet</h3>
          <p>Submit your first film essay using the "Write Review" tab.</p>
        </div>
      </div>
    </div>

  </div>

  <script>
 <script type="module">
  // 1. IMPORT THE DATABASE ENGINE
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

  // 2. YOUR UNIQUE FILING CABINET KEYS (We need to get these next)
  const firebaseConfig = {
    apiKey: "WE_NEED_YOUR_API_KEY",
    projectId: "WE_NEED_YOUR_PROJECT_ID",
    // ... we will fill the rest in once we create your free account
  };

  // Connect to your specific database
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 3. THE PAGE FLIPPER (Unchanged - keeps your tabs working perfectly)
  window.switchTab = function(tabId) {
    document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
    document.getElementById(tabId).classList.add('active');
    
    const buttons = document.querySelectorAll('.nav-btn');
    if (tabId === 'home') buttons[0].classList.add('active');
    if (tabId === 'write') buttons[1].classList.add('active');
    if (tabId === 'archive') buttons[2].classList.add('active');
  }

  // 4. THE NEW "SUBMIT" FUNCTION
  window.submitReview = async function(e) {
    e.preventDefault();
    
    // Grab the text you typed (same as before)
    const title = document.getElementById('filmTitle').value;
    const rating = document.getElementById('rating').value;
    const essay = document.getElementById('essayText').value;
    const author = document.getElementById('authorName').value;

    // INSTEAD of just taping it to the screen, send it to the database:
    await addDoc(collection(db, "reviews"), {
      title: title,
      rating: rating,
      essay: essay,
      author: author,
      timestamp: new Date()
    });

    // Clear the form and refresh the screen to show the new saved review
    document.getElementById('reviewForm').reset();
    loadArchive();
    switchTab('archive');
  }

  // 5. THE NEW "LOAD ARCHIVE" FUNCTION
  async function loadArchive() {
    // This tells the website: "Go to the database, get every review, and put them on the screen."
    // (I will write the code that builds your beautiful review cards here once we connect the database)
  }

  // Tell the website to check the database the second someone opens CineLogue
  loadArchive();
</script>
  </script>
</body>
</html>
